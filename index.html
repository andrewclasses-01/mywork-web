<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>myWork</title>
<!-- (v2.4.1) logo kiểu B: tab trình duyệt + màn hình chính điện thoại (vẽ bằng tools/tao-icon.ps1) -->
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icon-180.png?v=2"><!-- (v2.4.2) ảnh VUÔNG phủ kín: iOS tô góc trong suốt thành đen -->
<link rel="manifest" href="manifest.json?v=3"><!-- (v2.5.2) id + start_url RIÊNG: iOS không lẫn với web app andrewclasses.com -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E7C6E">
<meta name="apple-mobile-web-app-title" content="myWork">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="vendor/Sortable.min.js"></script>
<link rel="stylesheet" href="mylink/mylink.css">
<link rel="stylesheet" href="tap/tap.css">
<link rel="stylesheet" href="nhac/nhac.css">
<style>
:root{--ac:#0E7C6E;--ac2:#0b6a5e;--acl:#e7f5f2;--acm:#b9e3da;--tx:#1e293b;--mu:#64748b;--li:#eef0f4;--sb:#fafbfb}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e6ebea;font-family:Inter,'Segoe UI',sans-serif;font-weight:500;color:var(--tx);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[contenteditable]{outline:none}
[contenteditable]:empty::before{content:attr(data-ph);color:#94a3b8}

/* thanh điều khiển (ngoài mẫu) */
.ctl{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#0f2f2b;color:#fff}
.ctl b{font-size:15px;margin-right:6px}
.seg{display:flex;background:#1b4540;border-radius:10px;padding:3px}
.seg button{padding:7px 14px;border-radius:8px;font-size:13px;color:#cde7e2}
.seg button.on{background:#fff;color:#0f2f2b;font-weight:600}
.ctl .rs{padding:7px 12px;border-radius:8px;font-size:13px;background:#1b4540;color:#cde7e2}
.ctl .note{font-size:12px;color:#9cc9c1;margin-left:auto}
.stage{display:flex;justify-content:center;padding:14px 16px 40px}
.frame{width:100%;max-width:1360px;height:820px;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.18);background:#fff;position:relative}
.frame.phone{max-width:390px;height:820px;border-radius:44px;border:10px solid #111}

.app{display:flex;height:100%;position:relative;overflow:hidden}
/* ---------- cột trái ---------- */
.side{width:268px;flex:none;background:var(--sb);border-right:1px solid var(--li);padding:14px 10px;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:16px}
.brand .lg{width:28px;height:28px;flex:none;display:block}   /* (v2.4.1) logo tròn kiểu B = web/logo.svg */
.srch{display:flex;align-items:center;gap:8px;margin:0 2px 12px;padding:8px 10px;border-radius:10px;background:#f0f3f2;color:#94a3b8;font-size:13px}
.srch kbd{margin-left:auto;font:500 11px Inter;background:#fff;border:1px solid #e2e8f0;border-radius:5px;padding:1px 5px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:14px;color:#334155;width:100%;text-align:left}
.nav:hover{background:#eef2f1}
.nav.on{background:var(--acl);color:var(--ac2);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;color:#94a3b8;font-weight:500}
.nav .dot{width:10px;height:10px;border-radius:3px;flex:none;margin:0 4px}
.nav .em{width:18px;text-align:center;font-size:14px}
.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8;padding:14px 10px 6px;font-weight:600;display:flex;align-items:center}
.cap button{margin-left:auto;color:#94a3b8;font-size:16px;line-height:1;padding:0 4px}
.newl{display:flex;align-items:center;gap:10px;padding:9px 10px;color:var(--ac);font-size:14px;font-weight:500;border-radius:9px;width:100%}
.newl:hover{background:#eef2f1}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 2px;font-size:14px;border-top:1px solid var(--li)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#14a08e,#0E7C6E);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 8px 24px rgba(15,23,42,.15)}

/* ---------- giữa ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;position:relative}
.head{padding:22px 30px 0;border-top:4px solid var(--lc,transparent)}
.h1row{display:flex;align-items:center;gap:12px}
.h1row .em{font-size:28px}
.h1row h1{font-size:26px;font-weight:700;letter-spacing:-.01em;min-width:40px}
.h1row .r{margin-left:auto;display:flex;gap:6px}
.head p{font-size:13px;color:var(--mu);margin:4px 0 0 2px}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mu)}
.ib:hover{background:#f0f3f2}
.vbar{display:flex;align-items:center;gap:4px;margin-top:14px;border-bottom:1px solid var(--li)}
.vt{display:flex;align-items:center;gap:6px;padding:9px 12px;font-size:13.5px;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.vt.on{color:var(--tx);border-color:var(--ac)}
.vt svg.i{width:15px;height:15px}
.vbar .r{margin-left:auto;display:flex;gap:2px}
.tb{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--mu);padding:6px 9px;border-radius:8px}
.tb:hover{background:#f0f3f2}
.tb.on{color:var(--ac2);background:var(--acl)}
.tb svg.i{width:15px;height:15px}
.qa{margin:14px 30px 2px;border:1.5px solid #e2e8f0;border-radius:12px;transition:border-color .2s,box-shadow .2s}
.qa:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px var(--acl)}
.qa .in{display:flex;align-items:center;gap:12px;padding:11px 14px}
.qa .plus{width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none}
.qa .plus svg.i{width:14px;height:14px;stroke-width:2.6}
.qa input{flex:1;border:0;outline:none;font-size:14.5px;background:none;min-width:0}
.qa input::placeholder{color:#94a3b8}
.qa .prev{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px 48px}
.qa .prev:empty{display:none}
.qa .hint{font-size:11.5px;color:#a3b1c2;white-space:nowrap}
.body{flex:1;overflow:auto;padding:4px 30px 30px}
.grp{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--mu);padding:16px 4px 6px;user-select:none}
.grp.click{cursor:pointer}
.grp .c{background:#f0f3f2;border-radius:99px;padding:0 7px;font-size:11px}
.grp.over{color:#dc2626}
.grp .car{transition:transform .2s;display:inline-block}
.grp.shut .car{transform:rotate(-90deg)}
.gbox{min-height:4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;background:#fff;transition:background .15s}
.row:hover{background:#f7faf9}
.row.sel{background:#eef8f6;border-color:#cfeae4}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--lc,#94a3b8);flex:none;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.ck:hover{background:color-mix(in srgb,var(--lc,#94a3b8) 15%,transparent)}
.ck.on{background:var(--lc,var(--ac));border-color:var(--lc,var(--ac))}
.ck.on::after{content:'';width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.tt{flex:1;min-width:0}
.tt b{font-weight:500;font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .tt b{text-decoration:line-through;color:#94a3b8}
.meta{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.meta:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mu);background:#f1f5f9;border-radius:6px;padding:2px 7px;font-weight:500;white-space:nowrap}
.chip svg.i{width:12px;height:12px}
.chip.over{background:#fef2f2;color:#dc2626}
.chip.today{background:var(--acl);color:var(--ac2)}
.chip.lst{background:transparent;padding-left:0}
.chip.lst::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--lc)}
.chip.new{background:var(--acl);color:var(--ac2)}
.chip .x{margin-left:2px;cursor:pointer;opacity:.6}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.p-todo{background:#f1f1ef;color:#787774}.p-doing{background:#e3f1fb;color:#1d6c95}
.p-wait{background:#fbf3db;color:#a06b00}.p-done{background:#e6f4ea;color:#2f7a4f}
.star{padding:4px;color:#94a3b8}.star.on{color:var(--ac)}.star.on svg{fill:var(--ac)}
.empty{text-align:center;color:#94a3b8;padding:60px 20px;font-size:14px}
.empty .big{font-size:42px;margin-bottom:10px}
/* kanban */
.board{display:flex;gap:14px;overflow:auto;padding:16px 0 4px;height:100%;align-items:flex-start}
.col{width:270px;flex:none;background:#f6f8f8;border-radius:14px;padding:10px;max-height:100%;display:flex;flex-direction:column}
.colh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:4px 4px 10px}
.colh .c{margin-left:auto;font-size:12px;color:#94a3b8}
.kbox{min-height:40px;overflow:auto;flex:1}
.kc{background:#fff;border:1px solid var(--li);border-radius:11px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(15,23,42,.05);cursor:grab;font-size:14px}
.kc:hover{border-color:var(--acm)}
.kc.sel{border-color:var(--ac)}
.kc b{font-weight:500;display:block;margin-bottom:8px;line-height:1.35}
.kc.done b{text-decoration:line-through;color:#94a3b8}
.kc .meta{margin:0}
/* lịch */
.calh{display:flex;align-items:center;gap:8px;padding:14px 0 10px}
.calh b{font-size:16px;min-width:140px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--li);border-radius:12px;overflow:hidden}
.cal .dh{font-size:12px;color:var(--mu);font-weight:600;padding:8px;background:#f6f8f8;border-bottom:1px solid var(--li)}
.cal .d{min-height:104px;border-right:1px solid #f1f3f4;border-bottom:1px solid #f1f3f4;padding:5px;font-size:12px;color:#94a3b8;cursor:pointer;display:flex;flex-direction:column}
.cal .d.out{background:#fbfcfc;color:#cbd5e1}
.cal .d:hover{background:#f7fbfa}
.cal .d.td{background:#f0f9f7}
.cal .d .dn{align-self:flex-start;padding:1px 6px;border-radius:99px}
.cal .d.td .dn{background:var(--ac);color:#fff}
.cal .evs{flex:1;min-height:20px}
.cal .ev{display:block;margin-top:4px;font-size:11.5px;color:var(--tx);background:#fff;border-left:3px solid var(--lc);border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:grab}
.cal .ev.done{text-decoration:line-through;color:#94a3b8}
/* ---------- chi tiết ---------- */
.detail{width:0;flex:none;overflow:auto;border-left:1px solid var(--li);background:#fff;transition:width .28s cubic-bezier(.22,.9,.3,1)}
.detail.show{width:392px}
.dwrap{width:392px;padding:16px 22px 24px}
.dtop{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);padding-bottom:12px}
.dtop .chip{cursor:pointer;font-size:12.5px}
.dtop .chip:hover{background:#f1f5f9}
.dh2{display:flex;gap:12px;align-items:flex-start}
.dh2 .ck{margin-top:4px;width:22px;height:22px}
.dh2 .ttl{font-size:20px;font-weight:700;line-height:1.3;flex:1;padding:1px 4px;border-radius:6px}
.dh2 .ttl:focus{background:#f6f8f8}
.myday{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;background:#f6f8f8;color:var(--mu);font-size:13.5px;font-weight:600;margin:12px 0 4px}
.myday:hover{background:#eef2f1}
.myday.on{background:#fff4e5;color:#c2410c}
.props{margin:8px 0 4px}
.prop{display:flex;align-items:center;min-height:36px;font-size:13.5px;border-radius:8px;padding:0 6px}
.prop:hover{background:#f7f9f9}
.prop .k{width:112px;color:var(--mu);display:flex;align-items:center;gap:8px;flex:none}
.prop .k svg.i{width:15px;height:15px}
.prop .v{display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:1;min-width:0;cursor:pointer;min-height:28px}
.prop .ph{color:#94a3b8}
.prop input.pin{border:0;outline:none;background:none;font-size:13.5px;flex:1;min-width:60px;padding:4px 0}
.prop .soon{font-size:11px;color:#94a3b8;background:#f1f5f9;padding:2px 8px;border-radius:99px}
.files{display:flex;flex-direction:column;gap:4px;width:100%}
.file{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 8px;border:1px solid var(--li);border-radius:8px}
.file .ext{background:var(--ac);color:#fff;font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px}
.file small{color:#94a3b8;margin-left:auto}
.sec{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 6px;display:flex}
.sec span{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:#94a3b8}
.prog{height:4px;background:#f1f5f9;border-radius:9px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.step{display:flex;gap:10px;align-items:center;padding:6px 4px;font-size:14px;border-radius:8px}
.step:hover{background:#f7f9f9}
.step .ck{width:17px;height:17px}
.step .st{flex:1;padding:1px 2px}
.step.done .st{text-decoration:line-through;color:#94a3b8}
.step .del{opacity:0;color:#94a3b8}
.step:hover .del{opacity:1}
.addstep{display:flex;gap:10px;align-items:center;padding:6px 4px;font-size:14px;color:var(--ac)}
.addstep input{border:0;outline:none;background:none;flex:1;font-size:14px}
.addstep input::placeholder{color:var(--ac)}
.notep{border:1px solid var(--li);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;color:#334155;min-height:110px}
.notep:focus-within{border-color:var(--acm)}
.notep h3{font-size:16px;margin:4px 0 2px}
.notep ul{padding-left:20px}
.notep hr{border:0;border-top:1px solid #e2e8f0;margin:8px 0}
.notep .todo{display:flex;gap:8px;align-items:center}
.notep .todo i{width:14px;height:14px;border:1.5px solid #94a3b8;border-radius:4px;flex:none;display:inline-block}
.mention{color:var(--ac2);background:var(--acl);border-radius:5px;padding:0 4px;font-weight:500;cursor:pointer}
.nh{font-size:11.5px;color:#a3b1c2;margin-top:6px}
.dfoot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#94a3b8;border-top:1px solid var(--li);margin-top:20px;padding-top:12px}
.dfoot button{color:#94a3b8;display:flex;align-items:center;gap:6px}
.dfoot button:hover{color:#dc2626}
/* menu nổi + toast */
.pop{position:absolute;z-index:60;background:#fff;border:1px solid #e5e9ec;border-radius:12px;box-shadow:0 16px 40px rgba(15,23,42,.16);padding:6px;min-width:210px;display:none;max-height:420px;overflow:auto}
.pop.on{display:block;animation:pin .14s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(-4px)}}
.pop .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;width:100%;text-align:left}
.pop .it:hover,.pop .it.hi{background:#f0f5f4}
.pop .it .r{margin-left:auto;font-size:12px;color:#94a3b8}
.pop .it.red{color:#dc2626}
.pop .it.cur{color:var(--ac2);font-weight:600}
.pop .hr{height:1px;background:var(--li);margin:4px 6px}
.pop .lab{font-size:11px;font-weight:600;color:#94a3b8;padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.05em}
.pop .pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px 8px}
.pop .pal button{width:24px;height:24px;border-radius:7px}
.pop input[type=date]{margin:4px 8px 6px;padding:6px 8px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px}
.toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,20px);background:#0f2f2b;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s;z-index:70;white-space:nowrap;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{color:#7ee0cf;font-weight:600}
/* ---------- điện thoại ---------- */
.ptop,.pbar,.grab,.scrim{display:none}
.phone .ptop{display:flex;align-items:center;gap:14px;padding:48px 16px 2px;color:var(--mu)}
.phone .pbar{display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--li);padding:8px 0 26px;background:#fff}
.pbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#94a3b8;font-weight:500}
.pbar .on{color:var(--ac)}
.pbar .fab{width:50px;height:50px;border-radius:16px;background:var(--ac);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(14,124,110,.35);margin-top:-24px}
.phone .side{position:absolute;left:0;top:0;bottom:0;width:84%;z-index:30;transform:translateX(-102%);transition:transform .3s cubic-bezier(.22,.9,.3,1);padding-top:50px;box-shadow:12px 0 40px rgba(0,0,0,.15)}
.phone .side.open{transform:none}
.phone .scrim{display:block;position:absolute;inset:0;background:rgba(15,23,42,.35);z-index:25;opacity:0;pointer-events:none;transition:opacity .3s}
.phone .scrim.on{opacity:1;pointer-events:auto}
.phone .detail{position:absolute;left:0;right:0;bottom:0;top:10%;width:auto!important;border-radius:22px 22px 0 0;z-index:28;box-shadow:0 -12px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .32s cubic-bezier(.22,.9,.3,1);border:0}
.phone .detail.show{transform:none}
.phone .dwrap{width:auto;padding:4px 20px 30px}
.phone .grab{display:block;width:40px;height:5px;border-radius:3px;background:#cbd5e1;margin:8px auto 6px}
.phone .dclose{display:none}
.phone .head{padding:2px 16px 0}
.phone .h1row h1{font-size:24px}
.phone .vbar .r .lbl{display:none}
.vt{white-space:nowrap}.phone .vt{padding:9px 8px}
.phone .body{padding:4px 10px 16px}
.phone .qa{display:none;position:absolute;left:10px;right:10px;bottom:96px;margin:0;background:#fff;z-index:27;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.phone .qa.on{display:block}
.phone .col{width:250px}
.phone .cal .d{min-height:62px;padding:2px}
.phone .cal .ev{font-size:9.5px;padding:1px 3px;border-left-width:2px}
.phone .row{padding:10px 8px}

/* ================= v3 TỐI GIẢN — ghi đè ================= */
:root{--tx:#202124;--mu:#80868b;--li:#f0f1f2}
body{background:#eceff0}
/* cột trái: không màu icon, không emoji, chữ nhẹ */
.side{background:#fafafa;border-right:1px solid #eeeff0;padding:16px 10px}
.brand{padding:2px 8px 16px;font-size:15px}
.nav{color:#3c4043;padding:7px 10px;gap:12px}
.nav svg.i{color:#80868b;width:17px;height:17px}
.nav.on{background:#e8f3f1;color:var(--ac2);font-weight:500}
.nav.on svg.i{color:var(--ac)}
.nav .n{color:#b0b5ba;font-weight:500}
.nav .dot{width:8px;height:8px;border-radius:50%;margin:0 4.5px}
.sep{height:1px;background:#eeeff0;margin:10px 8px}
.newl{color:#80868b;font-weight:500;padding:7px 10px;gap:12px}
.newl svg.i{width:17px;height:17px}
.cap{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;color:#9aa0a6;padding:16px 10px 4px;cursor:pointer;gap:6px}
.cap .car{font-size:10px;transition:transform .2s;display:inline-block}
.cap.shut .car{transform:rotate(-90deg)}
.me{display:block;border-top:1px solid #eeeff0;padding-top:8px}
.who{display:flex;align-items:center;gap:10px;padding:8px 10px 0;font-size:13.5px;color:#3c4043}
.av{width:26px;height:26px;font-size:10px}
/* đầu trang: chỉ tên + 3 nút nhỏ */
.head{padding:26px 36px 4px;border:0}
.h1row h1{font-size:24px;font-weight:600}
.head p{font-size:13px;color:#9aa0a6;margin:2px 0 0}
.h1row .r{align-items:center;gap:4px}
.vseg{display:flex;background:#f3f4f5;border-radius:9px;padding:2px;margin:0 4px}
.vseg button{width:32px;height:28px;border-radius:7px;display:grid;place-items:center;color:#9aa0a6}
.vseg button svg.i{width:16px;height:16px}
.vseg button.on{background:#fff;color:var(--ac);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sugb{position:relative;color:#f59e0b}
.sugb i{position:absolute;top:3px;right:2px;font:600 9.5px Inter;font-style:normal;background:#f59e0b;color:#fff;border-radius:99px;min-width:14px;height:14px;display:grid;place-items:center;padding:0 3px}
/* ô thêm việc: một dòng nhẹ, mẹo chỉ hiện khi bấm vào */
.qa{margin:12px 36px 6px;border:0;border-radius:10px;background:#f6f7f7;box-shadow:none}
.qa:focus-within{background:#fff;box-shadow:0 0 0 1.5px var(--ac)}
.qa .in{padding:10px 12px}
.qa .plus{background:none;color:var(--ac);width:20px;height:20px}
.qa .plus svg.i{width:18px;height:18px;stroke-width:2.2}
.qa .prev{padding:0 12px 8px 44px}
.qa .hint{display:none;font-size:11.5px;color:#a8adb3;padding:0 12px 9px 44px;white-space:normal}
.qa:focus-within .hint{display:block}
/* danh sách việc: ô tròn + tên + hạn mờ bên phải */
.body{padding:2px 36px 40px}
.row{padding:11px 10px;border-radius:8px;gap:14px;border:0;border-bottom:1px solid #f3f4f5;border-radius:0}
.row:hover{background:#fafbfb}
.row.sel{background:#f0f8f6;border-color:#f0f8f6;border-radius:8px}
.ck{width:19px;height:19px;border-width:1.6px}
.tt b{font-weight:500;font-size:14.5px;color:#202124}
.due{font-size:12.5px;color:#9aa0a6;white-space:nowrap}
.due.over{color:#d93025}.due.today{color:var(--ac)}
.star{opacity:0;transition:opacity .15s}
.row:hover .star,.star.on,.kc .star{opacity:1}
.star.on{color:#f2b100}.star.on svg{fill:#f2b100}
.grp{font-size:12.5px;font-weight:500;color:#9aa0a6;padding:20px 10px 6px}
.grp .c{background:none;padding:0;color:#b0b5ba}
.grp.over{color:#d93025}
.empty{padding:70px 20px;color:#b0b5ba}
/* kanban: thẻ chỉ tên + hạn */
.col{background:#f7f8f8;border-radius:12px}
.colh{font-weight:500;color:#5f6368;gap:7px}
.sdot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.sdot.p-todo{color:#b0b5ba}.sdot.p-doing{color:#2b8bd6}.sdot.p-wait{color:#e0a000}.sdot.p-done{color:#2f9e5a}
.sdot[class*="p-"]{background:currentColor}
.kc{border-color:#eceeef;box-shadow:none;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--lc,#ddd)}
.kc b{margin:0;font-weight:500}
.kc .due{align-self:flex-start}
/* lịch nhẹ hơn */
.cal .ev{box-shadow:none;background:#f6f7f7;border-left-width:2px}
/* chi tiết: chỉ cái đã đặt; cái chưa đặt thành hàng nút nhỏ */
.detail{border-left:1px solid #eeeff0;overflow-x:hidden}
.detail .dwrap{width:391px}
.dwrap{padding:14px 24px 24px}
.dtop{padding-bottom:10px}
.lname{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#80868b;padding:4px 8px;border-radius:7px;margin-left:-8px}
.lname:hover{background:#f3f4f5}
.lname .dot{width:8px;height:8px;border-radius:50%}
.dh2{margin-bottom:6px}
.dh2 .ttl{font-size:19px;font-weight:600}
#stl{margin-top:6px}
.step{padding:5px 2px}
.addstep{padding:5px 2px;color:#9aa0a6}
.addstep input::placeholder{color:#9aa0a6}
.props{margin:14px 0 2px;border-top:1px solid #f0f1f2;padding-top:8px}
.prop{min-height:34px}
.prop .k{color:#80868b;width:118px}
.prop .v{gap:6px}
.prop .red{color:#d93025}
.prop .x2{color:#b0b5ba;display:grid;place-items:center}
.prop .x2:hover{color:#d93025}
.tg{font-size:12.5px;color:#5f6368;background:#f3f4f5;border-radius:6px;padding:2px 7px}
.tg .x{margin-left:4px;cursor:pointer;opacity:.5}
.file{border:0;background:#f6f7f7;padding:6px 9px}
.adds{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 14px;padding-top:10px;border-top:1px solid #f0f1f2}
.adds button{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#9aa0a6;padding:6px 9px;border-radius:8px}
.adds button:hover{background:#f3f4f5;color:#3c4043}
.adds svg.i{width:14px;height:14px}
.notep{border:0;background:#fafafa;border-radius:10px;min-height:120px;position:relative}
.notep:focus-within{background:#fff;box-shadow:0 0 0 1.5px #dfe7e5}
.notep:focus-within::after{content:'Gõ / để chèn khối · @ để nhắc tới việc khác';position:absolute;right:12px;bottom:-20px;font-size:11px;color:#b0b5ba}
.dfoot{border:0;margin-top:26px;padding-top:0}
.pill{font-weight:500}

/* ================= v4 — màn 5–8 ================= */
.who{width:100%;text-align:left;border-radius:9px}
.who:hover{background:#f1f2f3}
.ib.hasf{position:relative;color:var(--ac)}
.ib.hasf::after{content:'';position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.qa .qtpl{width:28px;height:28px;color:#b0b5ba;opacity:0;transition:opacity .15s}
.qa:hover .qtpl,.qa:focus-within .qtpl{opacity:1}
/* (5) thanh lọc */
.fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 36px 0;padding:8px 0 2px}
.fb{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#5f6368;background:#f3f4f5;border-radius:99px;padding:5px 11px;white-space:nowrap}
.fb:hover{background:#e9ebec}
.fb.on{background:var(--acl);color:var(--ac2)}
.fb b{font-weight:600}
.fb .cv{font-size:9px;opacity:.6}
.fb.ghost{background:none;color:#9aa0a6}
.fb.ghost:hover{color:#3c4043}
.fb.save{background:var(--ac);color:#fff}
.fb.save:hover{background:var(--ac2)}
.fsep{width:1px;height:18px;background:#e3e5e7;margin:0 4px}
.fsp{flex:1}
.cb{width:15px;height:15px;border:1.5px solid #c4c8cc;border-radius:4px;flex:none;display:grid;place-items:center}
.cb.on{background:var(--ac);border-color:var(--ac)}
.cb.on::after{content:'';width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ldot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.pop .sdot{margin-right:2px}
.pin2{display:block;width:calc(100% - 16px);margin:4px 8px 6px;padding:8px 10px;border:1px solid #dfe3e6;border-radius:8px;font-size:13.5px;outline:none}
.pin2:focus{border-color:var(--ac)}
.pop .red{color:#d93025}
/* (7) tab Link */
.shared{display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa0a6;background:#f6f7f7;border-radius:99px;padding:5px 10px}
.lk{display:flex;gap:28px;padding-top:14px;align-items:flex-start}
.ldays{width:92px;flex:none;display:flex;flex-direction:column;gap:2px}
.lday{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:13px;color:#5f6368;position:relative}
.lday b{font-weight:600;width:24px;text-align:left}
.lday:hover{background:#f3f4f5}
.lday.td b,.lday.td span{color:var(--ac)}
.lday.on{background:var(--acl);color:var(--ac2)}
.lday i{position:absolute;right:8px;width:5px;height:5px;border-radius:50%;background:#c4c8cc}
.lcls{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;min-width:0}
.lcl{background:#fafafa;border-radius:12px;padding:12px 14px 8px}
.lch{display:flex;align-items:baseline;gap:8px;padding-bottom:6px}
.lch b{font-size:15px;font-weight:600}
.lch span{font-size:12px;color:#9aa0a6;margin-left:auto}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f1f2}
.lrow .ck{width:17px;height:17px;--lc:var(--ac)}
.lrow .ln{flex:1;font-size:13.5px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ln:hover{color:var(--ac2)}
.lrow.done .ln{color:#9aa0a6;text-decoration:line-through}
.lgo{color:#b0b5ba;display:grid;place-items:center;width:24px;height:24px;border-radius:6px}
.lgo:hover{background:#eceeef;color:var(--ac)}
.ladd{width:100%;border:0;background:none;outline:none;font-size:13px;padding:9px 0 4px;color:#3c4043}
.ladd::placeholder{color:#a8adb3}
/* (6) Ctrl K */
.ovbg{position:absolute;inset:0;background:rgba(32,33,36,.28);z-index:40;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.cmdk{position:absolute;left:50%;top:90px;transform:translateX(-50%);width:min(600px,calc(100% - 24px));background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.22);z-index:41;overflow:hidden;animation:pin .15s}
.cin{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f0f1f2;color:#9aa0a6}
.cin input{flex:1;border:0;outline:none;font-size:16px;background:none;color:var(--tx)}
.cin kbd,.srch kbd{font:500 11px Inter;background:#f3f4f5;border-radius:5px;padding:2px 6px;color:#9aa0a6}
.cres{max-height:390px;overflow:auto;padding:6px}
.cres .lab{font-size:11.5px;font-weight:500;color:#9aa0a6;padding:10px 10px 4px}
.cres .it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:14px;width:100%;text-align:left;color:var(--tx)}
.cres .it.hi,.cres .it:hover{background:#f0f8f6}
.cres .it svg.i{color:#9aa0a6;width:16px;height:16px}
.cres .it .r{margin-left:auto;font-size:12px;color:#9aa0a6}
.cres .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cres .tx.dn{text-decoration:line-through;color:#9aa0a6}
.cres mark{background:#fff3c4;color:inherit;border-radius:3px;padding:0 1px}
.ck.mini{width:15px;height:15px;border-width:1.5px}
.cft{display:flex;gap:16px;padding:8px 16px;border-top:1px solid #f0f1f2;font-size:11.5px;color:#b0b5ba}
/* (8) Cài đặt */
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 60px);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.22);z-index:41;display:flex;flex-direction:column;animation:pin .15s}
.mh{display:flex;align-items:center;padding:16px 18px 8px 22px}
.mh b{font-size:17px;font-weight:600}
.mh .ib{margin-left:auto}
.mb{overflow:auto;padding:4px 22px 22px}
.acct{display:flex;align-items:center;gap:12px;padding:12px 0 6px}
.acct .av{width:42px;height:42px;font-size:14px}
.acct small{display:block;font-size:12.5px;color:#9aa0a6;margin-top:2px}
.acct b{font-weight:600}
.btn2{margin-left:auto;font-size:13px;color:#d93025;padding:7px 12px;border-radius:8px;border:1px solid #f1d4d1}
.btn2:hover{background:#fdf1f0}
.sh{font-size:12px;font-weight:600;color:#9aa0a6;padding:20px 0 6px}
.srow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f3f4f5}
.srow>div{flex:1}
.srow b{font-weight:500;font-size:14px}
.srow small{display:block;font-size:12px;color:#9aa0a6;margin-top:2px}
.sw{width:36px;height:21px;border-radius:99px;background:#d7dadd;position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.22,.9,.3,1)}
.sw.on{background:var(--ac)}
.sw.on i{transform:translateX(15px)}
.tseg{display:flex;gap:8px}
.tseg button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;border:1.5px solid #e6e8ea;font-size:13.5px;color:#5f6368}
.tseg button.on{border-color:var(--ac);color:var(--ac2);background:var(--acl)}
.tseg svg.i{width:16px;height:16px}
.soon{font-size:11px;color:#9aa0a6;background:#f3f4f5;padding:3px 9px;border-radius:99px}
.hint2{display:block;font-size:12px;color:#9aa0a6;padding-top:8px}
.ver{text-align:center;font-size:11.5px;color:#c4c8cc;padding-top:22px}
/* (8) Đăng nhập */
.login{height:100%;display:grid;place-items:center;background:#f6f8f8;position:relative}
.lcard{width:min(360px,calc(100% - 32px));background:#fff;border-radius:18px;padding:34px 30px 26px;box-shadow:0 10px 40px rgba(15,23,42,.08);display:flex;flex-direction:column;gap:10px}
.lcard .brand{justify-content:center;font-size:22px;padding:0}
.lcard .brand .lg{width:38px;height:38px}
.lcard>p{text-align:center;color:#9aa0a6;font-size:14px;margin:2px 0 12px}
.lin{width:100%;border:1.5px solid #e6e8ea;border-radius:10px;padding:12px 14px;font-size:14.5px;outline:none;background:#fff}
.lin:focus{border-color:var(--ac)}
.lpw{position:relative}
.lpw .ib{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px}
.lbtn{background:var(--ac);color:#fff;font-weight:600;font-size:15px;padding:12px;border-radius:10px;margin-top:6px}
.lbtn:hover{background:var(--ac2)}
.lor{display:flex;align-items:center;gap:10px;color:#c4c8cc;font-size:12px;margin:6px 0}
.lor::before,.lor::after{content:'';flex:1;height:1px;background:#eceeef}
.lbtn2{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid #e6e8ea;padding:11px;border-radius:10px;font-size:14px;color:#3c4043}
.lbtn2:hover{background:#f8f9f9}
.gg{font-weight:700;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:17px}
.lcard small{text-align:center;color:#9aa0a6;font-size:12.5px;margin-top:8px}
/* điện thoại */
.phone .fbar{margin:8px 12px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.phone .fsp{flex:0 0 4px}
.phone .lk{flex-direction:column;gap:12px}
.phone .ldays{width:100%;flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px}
.phone .lday{flex-direction:column;gap:0;padding:6px 10px;flex:none}
.phone .lday b{width:auto;text-align:center}
.phone .lday i{right:auto;bottom:2px}
.phone .lcls{grid-template-columns:1fr;width:100%}
.phone .cmdk{top:56px}
.phone .modal{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-height:88%;border-radius:20px 20px 0 0}
.phone .login{padding-top:30px}
.btn2,.tseg button{white-space:nowrap}
.phone .tseg button{padding:9px 4px;gap:5px;font-size:13px}
.phone .shared{display:none}
.phone .modal .mb{padding:4px 18px 30px}

/* ================= CHẾ ĐỘ TỐI ================= */

/* ================= v5 — myLink nhúng + menu chuột phải ================= */
.mlhost{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;margin:10px 0 0;border-top:1px solid #eeeff0;
  background:radial-gradient(900px 500px at 80% -10%,var(--glow),transparent 60%),linear-gradient(180deg,var(--bg-2),var(--bg))}
.mlhost[hidden]{display:none}
.dk .mlhost{border-color:#2c2f33}
.mlhead{padding-bottom:0}
/* 22/10 thầy: chữ + icon myLink màu BÌNH THƯỜNG như các mục khác (bỏ xanh dương riêng) */
.pop .it[disabled]{opacity:.4;pointer-events:none}

/* ================= v6 — CHUYỂN ĐỘNG (một đường cong chung cubic-bezier(.22,.9,.3,1)) ================= */
:root{--ease:cubic-bezier(.22,.9,.3,1)}
/* cột trái: MỘT dải nền trượt giữa các mục */
.side{position:relative}
#sideIn{display:flex;flex-direction:column;flex:1;min-height:100%;position:relative;z-index:1}
.navpill{position:absolute;left:10px;right:10px;top:0;height:34px;border-radius:9px;background:#e8f3f1;z-index:0;pointer-events:none;
  transition:transform .26s var(--ease),height .26s var(--ease),opacity .15s}
.dk .navpill{background:var(--acl)}
.nav.on{background:transparent!important}
html[data-vt] .navpill{transition:none}
/* nút kiểu xem: viên trắng trượt */
.vseg{position:relative}
.vseg button{position:relative;z-index:1;background:none!important;box-shadow:none!important;transition:color .25s}
.vpill{position:absolute;left:2px;top:2px;width:32px;height:28px;border-radius:7px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:transform .24s var(--ease)}
.dk .vpill{background:#383c41}
/* hover / bấm: đổi màu êm */
.nav,.ib,.tb,.it,.fb,.newl,.who,.adds button,.lname,.btn2,.tseg button,.pbar button,.qa,.row,.kc,.cal .d,.prop,.step,.cres .it{transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s}
.ib:active,.tb:active,.fb:active,.vseg button:active,.pbar button:active,.lbtn:active,.lbtn2:active,.newl:active{transform:scale(.94);transition:transform .08s}
.row:active{transform:scale(.995)}
/* ô tròn tích + ngôi sao: nảy */
.ck.pop{animation:ckpop .42s var(--ease)}
@keyframes ckpop{0%{transform:scale(.55)}55%{transform:scale(1.2)}100%{transform:none}}
.ck.on::after{animation:none}
.ck.on.just::after{animation:tick .3s var(--ease)}
@keyframes tick{from{opacity:0;transform:rotate(-45deg) translate(1px,-1px) scale(.3)}}
.row.done .tt b{transition:color .3s}
.star svg{transition:fill .2s,transform .2s}
/* chi tiết: mở/đóng trượt + bàn thử điện thoại: tấm dưới */
.detail{transition:width .38s var(--ease)}
.phone .detail{transition:transform .4s var(--ease)}
.toast{transition:opacity .25s,transform .35s var(--ease)}
/* menu nổi: bỏ hiệu ứng cũ, JS tự phóng ra từ chỗ bấm */
.pop.on{animation:none}
.modal,.cmdk{animation:none}
.ovbg{animation:none}
/* ===== View Transitions: đổi màn ===== */
::view-transition-group(*){animation-duration:.4s;animation-timing-function:var(--ease)}
html:not([data-vt=theme])::view-transition-old(root),html:not([data-vt=theme])::view-transition-new(root){animation:none}
html[data-vt=theme]::view-transition-old(root){animation:.35s ease both vtFade}
html[data-vt=theme]::view-transition-new(root){animation:.35s ease both vtFadeIn}
html[data-vt=nav] #mainc{view-transition-name:mainc}
html[data-vt=nav] .detail{view-transition-name:detailp}
html[data-vt=view] #mbody{view-transition-name:mbody}
#mainc{display:flex;flex-direction:column;flex:1;min-height:0}
html[data-dir=down]::view-transition-old(mainc){animation:.22s cubic-bezier(.5,0,.75,0) both vtOutUp}
html[data-dir=down]::view-transition-new(mainc){animation:.42s var(--ease) both vtInUp}
html[data-dir=up]::view-transition-old(mainc){animation:.22s cubic-bezier(.5,0,.75,0) both vtOutDown}
html[data-dir=up]::view-transition-new(mainc){animation:.42s var(--ease) both vtInDown}
html[data-dir=left]::view-transition-old(mbody){animation:.2s cubic-bezier(.5,0,.75,0) both vtOutL}
html[data-dir=left]::view-transition-new(mbody){animation:.4s var(--ease) both vtInR}
html[data-dir=right]::view-transition-old(mbody){animation:.2s cubic-bezier(.5,0,.75,0) both vtOutR}
html[data-dir=right]::view-transition-new(mbody){animation:.4s var(--ease) both vtInL}
@keyframes vtOutUp{to{opacity:0;transform:translateY(-22px)}}
@keyframes vtInUp{from{opacity:0;transform:translateY(34px)}}
@keyframes vtOutDown{to{opacity:0;transform:translateY(22px)}}
@keyframes vtInDown{from{opacity:0;transform:translateY(-34px)}}
@keyframes vtOutL{to{opacity:0;transform:translateX(-28px)}}
@keyframes vtInR{from{opacity:0;transform:translateX(40px)}}
@keyframes vtOutR{to{opacity:0;transform:translateX(28px)}}
@keyframes vtInL{from{opacity:0;transform:translateX(-40px)}}
@keyframes vtFade{to{opacity:0}}
@keyframes vtFadeIn{from{opacity:0}}

.ecard{--eb:#eaf5f2;--ei:#3b4a50;--ec:#fff;--ea:#0E7C6E;--ey:#f6c453;--ep:#f6b3aa;--el:#d5dde0;--esh:rgba(14,60,52,.10)}

/* ================= v8 — chữ đậm · hình nền khung nội dung ================= */

function scrollBoxOf(el){for(let n=el;n&&n!==document.body;n=n.parentElement){const s=getComputedStyle(n).overflowY;if((s==='auto'||s==='scroll')&&n.scrollHeight>n.clientHeight+1)return n;}return null;}

const WD=['CN','T2','T3','T4','T5','T6','T7'];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseK=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const addD=(k,n)=>{const d=parseK(k);d.setDate(d.getDate()+n);return ymd(d);};
const TODAY=ymd(new Date());
const diff=k=>Math.round((parseK(k)-parseK(TODAY))/864e5);
function fmtDay(k){const n=diff(k),d=parseK(k);
  if(n===0)return'Hôm nay';if(n===1)return'Ngày mai';if(n===-1)return'Hôm qua';
  return `${WD[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}`;}
const dueCls=t=>!t.due||t.done?'':diff(t.due)<0?'over':diff(t.due)===0?'today':'';
const fmtDue=t=>(diff(t.due)<0&&!t.done?'Quá hạn · ':'')+fmtDay(t.due)+(t.time?' '+t.time:'');
function nextDue(k,rep){const d=parseK(k);
  if(rep==='day')d.setDate(d.getDate()+1);
  else if(rep==='weekday'){do{d.setDate(d.getDate()+1);}while(d.getDay()===0||d.getDay()===6);}
  else if(rep==='week')d.setDate(d.getDate()+7);
  else if(rep==='month')d.setMonth(d.getMonth()+1);
  else if(rep==='year')d.setFullYear(d.getFullYear()+1);
  return ymd(d);}

function scope(nav){
  const today=TODAY;
  if(nav==='myday')return{title:'Ngày của tôi',emoji:'☀️',sub:`${WD[new Date().getDay()]==='CN'?'Chủ nhật':'Thứ '+(new Date().getDay()+1)}, ${fmtDate(today)}`,pred:t=>t.myDay===today,newT:{myDay:today},grp:'myday'};
  if(nav==='important')return{title:'Quan trọng',emoji:'⭐',pred:t=>t.star,newT:{star:1}};
  if(nav==='planned')return{title:'Có hạn',emoji:'📅',pred:t=>!!t.due,newT:{due:today},grp:'planned'};
  if(nav==='all')return{title:'Tất cả',emoji:'🗂️',pred:()=>true,grp:'list'};
  if(nav==='done')return{title:'Đã hoàn thành',emoji:'✅',pred:t=>t.done,onlyDone:1,grp:'doneAt'};
  if(nav==='mylink')return{title:'myLink',mylink:1,pred:()=>false};
  if(nav==='tap')return{title:'Tập luyện',tap:1,pred:()=>false};
  if(nav==='nhac')return{title:'myMusic',nhac:1,pred:()=>false};   /* (v2.5.0) kho nhạc riêng — web/nhac/nhac.js */   /* (v2.4.0) mục Tập luyện — web/tap/tap.js */
  if(nav.startsWith('v:')){const v=DB.views.find(x=>'v:'+x.id===nav);if(!v)return scope('all');
    return{title:v.name,saved:fltText(v.f,v.grp),savedV:v,pred:fltPred(v.f),grpBy:v.grp,defView:v.view,
      newT:Object.assign({},v.f.lists&&v.f.lists.length===1?{list:v.f.lists[0]}:{},v.f.tags?{tags:[...v.f.tags]}:{})};}
  if(nav.startsWith('l:')){const l=L(nav.slice(2));return{title:l.name,emoji:l.emoji,color:l.color,list:l.id,pred:t=>t.list===l.id,newT:{list:l.id}};}
  return{title:'?',pred:()=>false};
}
/* (5) bộ lọc: {lists:[], status:[], due:'over|today|week|none|any', tags:[], star:1} */
const DUEF={over:'Quá hạn',today:'Hôm nay',week:'7 ngày tới',any:'Có hạn',none:'Không có hạn'};
const GRPS={none:'Không gom',list:'Danh sách',status:'Trạng thái',due:'Ngày hạn',project:'Dự án',tag:'Thẻ'};
function fltPred(f){f=f||{};return t=>{
  if(f.lists&&f.lists.length&&!f.lists.includes(t.list))return false;
  if(f.status&&f.status.length&&!f.status.includes(t.status))return false;
  if(f.tags&&f.tags.length&&!f.tags.some(x=>t.tags.includes(x)))return false;
  if(f.star&&!t.star)return false;
  if(f.myday&&t.myDay!==TODAY)return false;
  if(f.due){const n=t.due?diff(t.due):null;
    if(f.due==='none'?t.due:!t.due)return false;
    if(f.due==='over'&&!(n<0))return false;if(f.due==='today'&&n!==0)return false;if(f.due==='week'&&!(n>=0&&n<=7))return false;}
  return true;};}
const fltCount=f=>!f?0:['lists','status','tags'].filter(k=>f[k]&&f[k].length).length+(f.due?1:0)+(f.star?1:0);
function fltText(f,g){const p=[];f=f||{};
  if(f.lists&&f.lists.length)p.push(f.lists.map(id=>L(id).name).join(', '));
  if(f.status&&f.status.length)p.push(f.status.map(s=>ST[s]).join(', '));
  if(f.due)p.push(DUEF[f.due]);if(f.tags&&f.tags.length)p.push(f.tags.map(x=>'#'+x).join(' '));if(f.star)p.push('Quan trọng');
  if(g&&g!=='none')p.push('gom theo '+GRPS[g].toLowerCase());return p.join(' · ');}

  const sd=$('side'),y=on.getBoundingClientRect().top-sd.getBoundingClientRect().top+sd.scrollTop;   /* đo theo khung thật (offsetTop lệch vì #sideIn) */
  p.style.opacity='1';p.style.transform=`translateY(${y}px)`;p.style.height=on.offsetHeight+'px';}

/* ================== giữa ================== */
const SORTS={manual:'Thủ công (kéo-thả)',due:'Ngày hạn',star:'Quan trọng',title:'Tên (A→Z)',created:'Ngày tạo'};
function sorted(arr){
  const k=S.sort[S.nav]||'manual';
  const f={manual:(a,b)=>(S.set.starTop?(b.star|0)-(a.star|0):0)||a.order-b.order,due:(a,b)=>(a.due||'9999').localeCompare(b.due||'9999'),star:(a,b)=>(b.star|0)-(a.star|0)||a.order-b.order,
    title:(a,b)=>a.title.localeCompare(b.title,'vi'),created:(a,b)=>b.created.localeCompare(a.created)}[k];
  return [...arr].sort(f);
}
function metaHtml(t,showList){
  const l=L(t.list),m=[];
  if(showList)m.push(`<span class="chip lst" style="--lc:${l.color}">${esc(l.name)}</span>`);
  if(t.status!=='todo'&&!t.done)m.push(`<span class="pill p-${t.status}">${ST[t.status]}</span>`);
  if(t.due)m.push(`<span class="chip ${dueCls(t)}">${ic('cal')}${fmtDue(t)}</span>`);
  if(t.rep)m.push(`<span class="chip">${ic('repeat')}</span>`);
  if(t.steps.length)m.push(`<span class="chip">${ic('steps')}${t.steps.filter(s=>s.d).length}/${t.steps.length}</span>`);
  if(t.note)m.push(`<span class="chip">${ic('note')}</span>`);
  if(t.files.length)m.push(`<span class="chip">${ic('clip')}${t.files.length}</span>`);
  t.tags.forEach(x=>m.push(`<span class="chip">#${esc(x)}</span>`));
  return m.join('');
}
function rowHtml(t,showList){
  return `<div class="row${t.done?' done':''}${S.sel===t.id?' sel':''}" data-t="${t.id}" style="--lc:${L(t.list).color}">
    <span class="ck${t.done?' on':''}" data-ck="${t.id}"></span>
    <div class="tt"><b>${esc(t.title)}</b>${t.steps.length&&S.dense!=='full'?`<small class="sub">${t.steps.filter(x=>x.d).length} of ${t.steps.length}</small>`:''}${S.dense==='full'?`<div class="meta">${metaHtml(t,showList)}</div>`:''}</div>
    ${S.dense!=='full'&&t.due&&!t.done?`<span class="due ${dueCls(t)}">${dueShort(t)}</span>`:''}
    <button class="star${t.star?' on':''}" data-star="${t.id}">${ic('star')}</button></div>`;
}
/* ngày hạn ngắn gọn ở cuối dòng: "Hôm nay", "Mai", "T6", "24/10" */
function dueShort(t){const n=diff(t.due),d=parseK(t.due);
  if(n===0)return'Hôm nay';if(n===1)return'Mai';if(n<0)return`${d.getDate()}/${d.getMonth()+1}`;
  if(n<7)return WD[d.getDay()];return`${d.getDate()}/${d.getMonth()+1}`;}
function groups(sc,tasks){
  const undone=tasks.filter(t=>!t.done),dn=tasks.filter(t=>t.done);
  const G=[];
  if(sc.onlyDone){
    const by={};sorted(dn).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')).forEach(t=>(by[t.doneAt]=by[t.doneAt]||[]).push(t));
    Object.keys(by).forEach(k=>G.push({k:'d'+k,label:'Xong '+fmtDay(k).toLowerCase(),tasks:by[k]}));return G;}
  const gb=S.grp[S.nav]||sc.grpBy||(sc.grp==='planned'?'due':sc.grp==='list'?'list':'none');
  const by=(keyOf,labels)=>{const m=new Map();sorted(undone).forEach(t=>{const ks=[].concat(keyOf(t));ks.forEach(k=>{if(!m.has(k))m.set(k,[]);m.get(k).push(t);});});
    [...m.keys()].sort((a,b)=>labels.indexOf(a)-labels.indexOf(b)||String(a).localeCompare(String(b),'vi')).forEach(k=>G.push({k:'g'+k,label:k===''?'(Không có)':(labels.map?k:k),tasks:m.get(k)}));};
  if(gb==='due'){
    const b=[['over','Quá hạn',t=>t.due&&diff(t.due)<0],['td','Hôm nay',t=>t.due&&diff(t.due)===0],['tm','Ngày mai',t=>t.due&&diff(t.due)===1],
      ['wk','Tuần này',t=>t.due&&diff(t.due)>1&&diff(t.due)<=7],['lt','Sau này',t=>t.due&&diff(t.due)>7],['nd','Không có hạn',t=>!t.due]];
    const s=sorted(undone).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
    b.forEach(([k,lab,p])=>{const xs=s.filter(p);if(xs.length)G.push({k,label:lab,tasks:xs,cls:k==='over'?'over':''});});
  }else if(gb==='status'){['todo','doing','wait'].forEach(s=>{const xs=sorted(undone.filter(t=>t.status===s));if(xs.length)G.push({k:'s'+s,label:ST[s],tasks:xs});});
  }else if(gb==='project'){by(t=>t.project||'',[]);
  }else if(gb==='tag'){by(t=>t.tags.length?t.tags.map(x=>'#'+x):'',[]);
  }else if(gb==='list'){
    DB.lists.forEach(l=>{const xs=sorted(undone.filter(t=>t.list===l.id));if(xs.length)G.push({k:'l'+l.id,label:l.name,tasks:xs});});
  }else G.push({k:'main',label:'',tasks:sorted(undone)});
  if(dn.length)G.push({k:'dn',label:'Đã hoàn thành',tasks:dn,fold:1});
  return G;
}
/* renderMain có FLIP: dòng việc đổi chỗ thì TRƯỢT tới chỗ mới, dòng mới thì hiện dần (không nhảy giật) */
function renderMain(){
  const body=$('mbody');
  if(S.noFlip||!body||noMotion()||S.view==='cal')return _renderMain();
  const key=el=>el.dataset.t+(el.closest('.kbox')?'k':'');
  const before=new Map();body.querySelectorAll('[data-t]').forEach(el=>{const r=el.getBoundingClientRect();if(r.width)before.set(key(el),r);});
  _renderMain();
  if(!before.size)return;
  body.querySelectorAll('[data-t]').forEach(el=>{const b=before.get(key(el)),a=el.getBoundingClientRect();if(!a.width)return;
    if(b){const dx=b.left-a.left,dy=b.top-a.top;if(Math.abs(dx)>1||Math.abs(dy)>1)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:280,easing:EASE});}
    else el.animate([{opacity:0,transform:'translateY(-8px) scale(.98)'},{opacity:1,transform:'none'}],{duration:240,easing:EASE});});
}

  const sc=scope(S.nav);

  const tf=S.flt[S.nav],fp=fltPred(tf);

  const sug=S.nav==='myday'?DB.tasks.filter(t=>!t.done&&t.myDay!==TODAY&&t.due&&diff(t.due)<=1):[];

      <div class="r">
        ${sug.length?`<button class="ib sugb" data-a="sug" title="Gợi ý cho hôm nay">${ic('bulb')}<i>${sug.length}</i></button>`:''}
        <div class="vseg"><i class="vpill" style="transform:translateX(${['list','board','cal'].indexOf(S.view)*32}px)"></i>${[['list','list','Danh sách'],['board','board','Kanban'],['cal','cal','Lịch']].map(([k,i,l])=>`<button class="${S.view===k?'on':''}" data-view="${k}" title="${l}">${ic(i)}</button>`).join('')}</div>

    ${sub?`<p>${sub}</p>`:''}</div>`;
  renderFbar();

  const body=$('mbody');

  else{
    const hadE=!!body.querySelector('.ecard');      /* (v7) thẻ đã hiện rồi thì vẽ lại không nảy lại */
    if(sc.onlyDone&&!dn){body.innerHTML=emptyCard(sc,0,hadE);}
    else{const G=groups(sc,tasks);
    body.innerHTML=(!undone&&!sc.onlyDone?emptyCard(sc,dn,hadE):'')+
      G.map(g=>{const shut=g.fold?S.shut[S.nav+g.k]!==false:S.shut[S.nav+g.k];
        return `${g.label?`<div class="grp click${g.cls?' '+g.cls:''}${shut?' shut':''}" data-fold="${S.nav+g.k}"><span class="car">▾</span> ${g.label} <span class="c">${g.tasks.length}</span></div>`:''}
        <div class="gbox" data-g="${g.k}"${shut?' hidden':''}>${g.tasks.map(t=>rowHtml(t,!sc.list||g.sug)).join('')}</div>`;}).join('');}
  }
  bindSortables();
  if(S.view==='board'&&S.kOpen){const i=frame.querySelector(`.kinput[data-kst="${S.kOpen}"]`);if(i)i.focus();}
}

function fltMenu(k,a){
  const tf=S.flt[S.nav]=S.flt[S.nav]||{};
  const multi=(key,opts)=>openPop(a,opts.map(([v,lab,pre])=>`<button class="it" data-v="${esc(v)}"><span class="cb${(tf[key]||[]).includes(v)?' on':''}"></span>${pre||''}${esc(lab)}</button>`).join('')||'<div class="lab">Chưa có</div>',v=>{
    const arr=tf[key]=tf[key]||[];const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);renderMain();fltMenu(k,frame.querySelector(`[data-k="${k}"]`));});
  if(k==='lists')return multi('lists',DB.lists.map(l=>[l.id,l.name,`<span class="ldot" style="background:${l.color}"></span>`]));
  if(k==='status')return multi('status',Object.keys(ST).map(s=>[s,ST[s],`<span class="sdot p-${s}"></span>`]));
  if(k==='tags')return multi('tags',[...new Set(DB.tasks.flatMap(t=>t.tags))].map(x=>[x,'#'+x]));
  if(k==='due')return openPop(a,Object.keys(DUEF).map(d=>`<button class="it${tf.due===d?' cur':''}" data-v="${d}">${DUEF[d]}${tf.due===d?'<span class="r">✓</span>':''}</button>`).join('')+
    (tf.due?`<div class="hr"></div><button class="it" data-v="">Bỏ lọc hạn</button>`:''),v=>{tf.due=v;renderMain();});
  if(k==='star'){tf.star=tf.star?0:1;renderMain();return;}
  if(k==='grp')return openPop(a,Object.keys(GRPS).map(g=>`<button class="it${(S.grp[S.nav]||'none')===g?' cur':''}" data-v="${g}">${GRPS[g]}${(S.grp[S.nav]||'none')===g?'<span class="r">✓</span>':''}</button>`).join(''),
    v=>{S.grp[S.nav]=v==='none'?null:v;if(S.view!=='list'){S.view='list';S.viewSet=true;}renderMain();});
}
function saveView(a){
  openPop(a,`<div class="lab">Lưu thành chế độ xem</div><input class="pin2" id="pvName" placeholder="Tên, vd: Việc gấp tuần này" autocomplete="off"><button class="it cur" data-v="ok">${ic('check')} Lưu</button>`,()=>doSave());
  const inp=$('pvName');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter'){closePop();doSave();}if(e.key==='Escape')closePop();};
  function doSave(){const name=(inp.value||'').trim()||'Chế độ xem mới';const sc=scope(S.nav);
    const base=sc.savedV?sc.savedV.f:sc.list?{lists:[sc.list]}:S.nav==='important'?{star:1}:S.nav==='planned'?{due:'any'}:S.nav==='myday'?{myday:1}:{};
    const f=JSON.parse(JSON.stringify(Object.assign({},base,S.flt[S.nav]||{})));
    const id='u'+(nid());DB.views.push({id,name,ic:'layers',f,grp:S.grp[S.nav]||null,view:S.view});
    S.flt[S.nav]=null;S.grp[S.nav]=null;S.fOpen=false;S.vOpen=true;S.nav='v:'+id;S.viewSet=false;renderAll();toast('Đã lưu "'+name+'" vào cột trái');}
}

function parseQA(txt){
  if(!S.set.parse)return{title:txt.trim(),due:null,time:null,tags:[],star:0};
  let s=' '+txt+' ',due=null,time=null,star=0;const tags=[];
  s=s.replace(/\s#([\p{L}\p{N}_-]+)/gu,(m,g)=>{tags.push(g);return ' ';});
  s=s.replace(/\s!(?=\s)/g,()=>{star=1;return ' ';});
  s=s.replace(/\s(\d{1,2})\s?(?:h|giờ|g|:)(\d{2})?(?=\s)/i,(m,h,mm)=>{time=String(h).padStart(2,'0')+':'+(mm||'00');return ' ';});
  const rules=[[/\s(hôm nay|hnay)(?=\s)/i,0],[/\s(ngày mai|mai)(?=\s)/i,1],[/\s(ngày kia|mốt)(?=\s)/i,2]];
  for(const [re,n] of rules){if(re.test(s)){due=addD(TODAY,n);s=s.replace(re,' ');break;}}
  if(!due){s=s.replace(/\s(?:thứ\s?|t)([2-7])(?=\s)|\s(chủ nhật|cn)(?=\s)/i,(m,w,cn)=>{const want=cn?0:(+w-1)%7;const d=new Date();
    let k=(want-d.getDay()+7)%7||7;due=addD(TODAY,k);return ' ';});}
  if(!due){s=s.replace(/\s(\d{1,2})\/(\d{1,2})(?=\s)/,(m,d,mo)=>{const y=new Date().getFullYear();due=ymd(new Date(y,mo-1,+d));return ' ';});}
  if(time&&!due)due=TODAY;
  return{title:s.replace(/\s+/g,' ').trim(),due,time,tags,star};
}

    const items=[['h','Tiêu đề','H'],['todo','Danh sách tích','☑'],['ul','Gạch đầu dòng','•'],['hr','Đường kẻ','—'],['img','Ảnh','🖼']]
      .filter(x=>!ms[1]||x[1].toLowerCase().includes(ms[1].toLowerCase()));

      delBack(c,ms[0].replace(/^\s/,'').length);
      const H={h:'<h3>Tiêu đề</h3>',todo:'<div class="todo"><i contenteditable="false"></i> Việc cần tích</div>',ul:'<ul><li>Ý thứ nhất</li></ul>',hr:'<hr>',img:'<div>🖼 [ảnh sẽ chèn ở đây — nén trước khi lưu]</div>'}[v];
      insertBlock(nt,H);t.note=nt.innerHTML;renderRowOnly(t);});
  }else if(ma){
    const q=ma[1].trim().toLowerCase();
    const xs=DB.tasks.filter(x=>x.id!==t.id&&(!q||x.title.toLowerCase().includes(q))).slice(0,6);

      delBack(c,ma[0].replace(/^\s/,'').length);
      document.execCommand('insertHTML',false,`<span class="mention" contenteditable="false" data-go="${v}">@${esc(TK(+v).title)}</span>&nbsp;`);t.note=nt.innerHTML;renderRowOnly(t);});
  }else closePop();
}
/* chèn khối SAU khối đang đứng (không lồng vào trong), dòng trống thì thay luôn */
function insertBlock(nt,html){
  const s=getSelection();let n=s.rangeCount?s.getRangeAt(0).startContainer:null;
  while(n&&n.parentNode!==nt)n=n.parentNode;
  const tmp=document.createElement('div');tmp.innerHTML=html;const els=[...tmp.childNodes];
  if(!n){els.forEach(e=>nt.appendChild(e));}
  else{const empty=n.nodeType===3?!n.textContent.trim():!n.textContent.trim()&&!n.querySelector('hr,img');
    let ref=n;els.forEach(e=>{ref.after(e);ref=e;});if(empty)n.remove();}
  let last=els[els.length-1];if(last.tagName==='HR'){const d=document.createElement('div');d.innerHTML='<br>';last.after(d);last=d;}
  /* bôi đen chữ mẫu ("Tiêu đề", "Việc cần tích"…) để gõ đè luôn */
  const r=document.createRange();
  if(last.tagName==='UL')r.selectNodeContents(last.lastChild);
  else if(last.classList&&last.classList.contains('todo')){const tn=last.lastChild;r.setStart(tn,1);r.setEnd(tn,tn.length);}
  else if(last.tagName==='H3')r.selectNodeContents(last);
  else{r.selectNodeContents(last);r.collapse(false);}
  s.removeAllRanges();s.addRange(r);
}
function delBack(c,n){const s=getSelection();const r=document.createRange();const node=c.node;const end=Math.min(node.textContent.length,s.getRangeAt(0).startOffset);
  r.setStart(node,Math.max(0,end-n));r.setEnd(node,end);s.removeAllRanges();s.addRange(r);document.execCommand('delete');}
function openPopAtCaret(html,cb){const r=getSelection().getRangeAt(0).getBoundingClientRect();openPop({left:r.left,bottom:r.bottom},html,cb,true);}

/* ================== menu nổi ================== */
function openPop(anchor,html,cb,keys){
  const p=$('pop');p.getAnimations().forEach(x=>x.cancel());S.popTok=(S.popTok||0)+1;
  p.innerHTML=html;p.classList.add('on');S.popCb=cb;
  const fr=frame.getBoundingClientRect();const a=anchor.getBoundingClientRect?anchor.getBoundingClientRect():anchor;
  let x=a.left-fr.left,y=(a.bottom??a.top)-fr.top+4;
  const w=p.offsetWidth,h=p.offsetHeight;
  if(x+w>fr.width-8)x=fr.width-w-8;if(y+h>fr.height-8)y=Math.max(8,(a.top??a.bottom)-fr.top-h-4);
  x=Math.max(8,x);p.style.left=x+'px';p.style.top=y+'px';
  /* (v6) menu TRƯỢT/PHÓNG RA từ đúng chỗ vừa bấm: gốc biến hình = tâm của nút / điểm chuột */
  const ax=a.left+(a.width||0)/2-fr.left,ay=(a.top??a.bottom)-fr.top;
  p.style.transformOrigin=`${Math.max(0,Math.min(w,ax-x))}px ${y<ay?h:0}px`;
  if(!noMotion())p.animate([{opacity:0,transform:`scale(.6) translateY(${y<ay?8:-8}px)`},{opacity:1,transform:'none'}],{duration:260,easing:EASE});
  S.popKeys=keys?k=>{const its=[...p.querySelectorAll('.it')];let i=its.findIndex(e=>e.classList.contains('hi'));
    if(k==='Escape')return closePop();if(k==='Enter'){if(its[i])pick(its[i].dataset.v);return;}
    its[i]?.classList.remove('hi');i=(i+(k==='ArrowDown'?1:-1)+its.length)%its.length;its[i].classList.add('hi');}:null;
}
function closePop(instant){const p=$('pop');S.popCb=null;S.popKeys=null;if(!p||!p.classList.contains('on')||p.dataset.closing)return;
  if(instant||noMotion()){p.classList.remove('on');return;}
  /* đóng = thu nhỏ + mờ về đúng gốc nó mọc ra */
  const tok=S.popTok;p.dataset.closing='1';
  const an=p.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.88)'}],{duration:150,easing:'ease-in',fill:'forwards'});
  onDone(an,150,()=>{delete p.dataset.closing;if(S.popTok===tok)p.classList.remove('on');an.cancel();});
  an.oncancel=()=>{delete p.dataset.closing;};}
function pick(v){const cb=S.popCb;closePop();if(cb)cb(v);}

/* ================== (v6.1) CHUYỂN ĐỘNG ==================
   vt(): đổi màn NGAY LẬP TỨC (không chờ chụp ảnh màn như View Transitions — thầy chê trễ + mất chữ mục đang chọn 22/10).
   Cách làm: chép "bóng" nội dung cũ đè lên → vẽ nội dung mới liền → bóng cũ trượt ra + mờ (150ms), nội dung mới trượt vào CÙNG CHIỀU (240ms).
   Dải chọn cột trái + viên trắng kiểu xem trượt bằng CSS transition, nằm DƯỚI chữ nên không bao giờ che chữ.
   Chỉ đổi Sáng/Tối, Đăng nhập/xuất mới dùng View Transitions (mờ dần cả trang). */
const DUR_IN=240,DUR_OUT=150;
function vt(kind,dir,update){
  const run=()=>{S.noFlip=true;try{return update();}finally{S.noFlip=false;}};
  if(noMotion())return void run();
  /* (v2.2.0) ⛔ View Transition CHỜ khung vẽ kế tiếp mới gọi update — cửa sổ ẩn (mở cùng Windows nằm ở khay) thì KHÔNG BAO GIỜ
     gọi ⇒ kẹt ở màn đăng nhập. Lùi tuyệt đối: 0,4 s chưa chạy thì tự chạy (chạy đúng MỘT lần). */
  if(kind==='theme'){let xong=false;const mot=()=>{if(xong)return;xong=true;run();};
    if(document.startViewTransition&&!document.hidden){const d=document.documentElement;d.dataset.vt='theme';
      try{document.startViewTransition(mot).finished.finally(()=>delete d.dataset.vt);}catch(e){mot();}setTimeout(mot,400);}else mot();return;}
  const host=kind==='view'?$('mbody'):$('mainc');
  const ghost=host?ghostOf(host):null;
  if(ghost&&kind==='view')ghost.style.background='transparent';   /* (v10) nền đặc của bóng = vệt trắng nháy trên ảnh nền */
  run();
  const nh=kind==='view'?$('mbody'):$('mainc');if(!nh)return ghost&&ghost.remove();
  const D={down:[0,18,0,-12],up:[0,-18,0,12],left:[22,0,-16,0],right:[-22,0,16,0]}[dir]||[0,10,0,-8];
  const trong=ghost&&(kind==='view'||/rgba\(0, 0, 0, 0\)|transparent/.test(ghost.style.background||ghost.style.backgroundColor));
  nh.animate([{opacity:0,transform:`translate(${D[0]}px,${D[1]}px)`},{opacity:1,transform:'none'}],{duration:DUR_IN,easing:EASE,delay:trong?70:0,fill:'backwards'});
  if(ghost)onDone(ghost.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translate(${D[2]}px,${D[3]}px)`}],{duration:DUR_OUT,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'}),DUR_OUT,()=>ghost.remove());
}
/* bóng của nội dung cũ: bản chép tĩnh đặt đúng chỗ, không bấm được, giữ nguyên vị trí cuộn */
function ghostOf(host){const par=host.parentElement,r=host.getBoundingClientRect(),pr=par.getBoundingClientRect();if(!r.width)return null;
  const g=host.cloneNode(true);g.removeAttribute('id');g.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  Object.assign(g.style,{position:'absolute',left:(r.left-pr.left+par.scrollLeft)+'px',top:(r.top-pr.top+par.scrollTop)+'px',width:r.width+'px',height:r.height+'px',
    margin:'0',pointerEvents:'none',zIndex:'4',overflow:'hidden',background:getComputedStyle(host.closest('.main')||par).backgroundColor});   /* nền đặc: không chồng 2 lớp chữ */
  if(getComputedStyle(par).position==='static')par.style.position='relative';
  par.appendChild(g);
  const sb=host.matches('.body')?host:host.querySelector('.body');const gb=g.matches('.body')?g:g.querySelector('.body');if(sb&&gb)gb.scrollTop=sb.scrollTop;
  return g;}
function navIndex(k){const els=[...frame.querySelectorAll('.side [data-nav]')];const i=els.findIndex(e=>e.dataset.nav===k);return i<0?999:i;}
/* chọn mục cột trái: mục ở DƯỚI ⇒ nội dung đi LÊN (mới vào từ dưới); mục ở TRÊN ⇒ đi XUỐNG */

/* ⛔ logic KHÔNG được chờ hiệu ứng: cửa sổ ẩn/thu nhỏ thì đồng hồ hiệu ứng đứng ⇒ onfinish không bao giờ chạy. Luôn có hẹn giờ dự phòng. */
function onDone(an,ms,cb){let x=0;const f=()=>{if(!x){x=1;cb();}};an.onfinish=f;setTimeout(f,ms+80);}
/* (v14) ô tích vừa bấm: sau khi vẽ lại, tìm lại đúng ô đó (theo thuộc tính) và chỉ cho NÓ chạy hiệu ứng */

  const at=['data-ck','data-sck','data-dck','data-dsck'].find(a=>c.hasAttribute(a)),v=c.getAttribute(at),inDet=!!c.closest('#detail2');
  setTimeout(()=>{frame.querySelectorAll(`[${at}="${v}"]`).forEach(x=>{if(at==='data-sck'&&!!x.closest('#detail2')!==inDet&&frame.querySelector('#detail2.show'))return;
    x.classList.add('just');setTimeout(()=>x.classList.remove('just'),400);});},0);},true);
/* (v14) khung ghi chú (mọi nơi .notep): bấm vào lề/khoảng trống ⇒ vào ô gõ, con trỏ ở cuối */
frame.addEventListener('mousedown',e=>{const box=e.target.closest('.notep');if(!box||e.button!==0)return;const ed=box.querySelector('[contenteditable="true"]');
  if(!ed||ed.contains(e.target)&&e.target!==ed)return;if(e.target===ed&&ed.textContent.trim())return;
  e.preventDefault();ed.focus();const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);});
/* (v13) gập/mở một khối: huỷ hiệu ứng đang chạy (kể cả cái 'forwards' còn dính), bấm dồn thì lượt sau thắng */
function foldBox(box,open){box.getAnimations().forEach(a=>a.cancel());box.style.overflow='';const tok=box._ft=(box._ft||0)+1;
  if(noMotion()){box.hidden=!open;return;}
  if(open){box.hidden=false;const h=box.scrollHeight;box.style.overflow='hidden';
    onDone(box.animate([{height:'0px',opacity:0},{height:h+'px',opacity:1}],{duration:240,easing:EASE}),240,()=>{if(box._ft===tok)box.style.overflow='';});}
  else{const h=box.offsetHeight;box.style.overflow='hidden';const an=box.animate([{height:h+'px',opacity:1},{height:'0px',opacity:0}],{duration:220,easing:EASE,fill:'forwards'});
    onDone(an,220,()=>{if(box._ft!==tok)return;box.hidden=true;an.cancel();box.style.overflow='';});}}
function collapse(el,cb){if(!el||noMotion())return cb();const h=el.offsetHeight;el.style.overflow='hidden';
  onDone(el.animate([{height:h+'px',opacity:1},{height:'0px',opacity:0,paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px'}],{duration:240,easing:EASE,fill:'forwards'}),240,cb);}
/* tích xong: ô tròn nảy + gạch chữ, rồi dòng TRƯỢT xuống nhóm "Đã hoàn thành" (đang mở) hoặc THU GỌN biến mất (nhóm đang gập) */
function completeTask(t){
  const row=frame.querySelector(`#mbody [data-t="${t.id}"]`),becoming=!t.done;
  toggleDone(t);
  if(!row||!becoming||noMotion())return rerender();
  /* (v2.9.0) thầy: ẩn NGAY, nhanh, không lỗi ⇒ mờ 120ms rồi vẽ lại không trượt (bỏ nảy + thu gọn 300+240ms) */
  const ck=row.querySelector('.ck');if(ck)ck.classList.add('on');row.classList.add('done');
  const het=()=>{S.noFlip=true;try{rerender();}finally{S.noFlip=false;}};
  onDone(row.animate([{opacity:1},{opacity:0}],{duration:120,easing:'ease-out',fill:'forwards'}),120,het);
}
function popEl(sel){const el=frame.querySelector(sel);if(el&&!noMotion())el.animate([{transform:'scale(.6)'},{transform:'scale(1.25)'},{transform:'none'}],{duration:380,easing:EASE});}
/* hộp Cài đặt / Tìm kiếm PHÓNG RA từ chỗ vừa bấm, đóng thì THU VỀ chỗ đó */
function ovlFrames(el){const base=getComputedStyle(el).transform,b=base==='none'?'':base,f=S.ovlFrom,r=el.getBoundingClientRect();
  let start=`${b} scale(.7)`;
  if(f){const dx=(f.left+(f.width||0)/2)-(r.left+r.width/2),dy=(f.top+(f.height||0)/2)-(r.top+r.height/2);start=`translate(${dx}px,${dy}px) ${b} scale(.1)`;}
  return[{opacity:0,transform:start},{opacity:1,transform:base}];}
function ovlIn(){const el=frame.querySelector('#ovl .modal,#ovl .cmdk'),bg=frame.querySelector('#ovl .ovbg');if(!el||noMotion())return;
  if(bg)bg.animate([{opacity:0},{opacity:1}],{duration:260});el.animate(ovlFrames(el),{duration:300,easing:EASE});}
function closeOvl(){const el=frame.querySelector('#ovl .modal,#ovl .cmdk'),bg=frame.querySelector('#ovl .ovbg');
  const done=()=>{S.cmdk=false;S.modal=null;renderOvl();};
  if(!el||noMotion())return done();
  if(bg)bg.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'});
  onDone(el.animate(ovlFrames(el).reverse(),{duration:240,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'}),240,done);}
const rectOf=el=>{const r=el.getBoundingClientRect();return{left:r.left,top:r.top,width:r.width,height:r.height};};

function toggleDone(t){
  t.done=t.done?0:1;
  if(t.done){t.doneAt=TODAY;t.prevStatus=t.status;t.status='done';afterDone(t);}
  else{t.status=t.prevStatus&&t.prevStatus!=='done'?t.prevStatus:'todo';}
}
function afterDone(t){
  if(t.rep&&t.due){const n=JSON.parse(JSON.stringify(t));Object.assign(n,{id:nid(),done:0,doneAt:null,status:'todo',due:nextDue(t.due,t.rep),created:TODAY,order:t.order});
    n.steps.forEach(s=>s.d=0);DB.tasks.push(n);t.rep=null;setTimeout(()=>toast('Đã tạo lần lặp tiếp theo: '+fmtDay(n.due)),50);}
  else setTimeout(()=>toast('Đã xong: '+t.title,()=>{t.done=0;t.status=t.prevStatus&&t.prevStatus!=='done'?t.prevStatus:'todo';rerender();}),10);
  ding();
}
function ding(){if(!S.set.ding)return;try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
  o.frequency.setValueAtTime(880,a.currentTime);o.frequency.setValueAtTime(1320,a.currentTime+.08);g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.start();o.stop(a.currentTime+.36);}catch(e){}}
function delTask(t,ok){
  if(S.set.confirmDel&&!ok){const fr=frame.getBoundingClientRect();
    return openPop({left:fr.left+fr.width/2-110,top:fr.top+fr.height/2-60,bottom:fr.top+fr.height/2-60},`<div class="lab">Xoá việc này?</div><div style="padding:2px 10px 8px;font-size:13.5px">"${esc(t.title)}"</div>
      <button class="it red" data-v="y">${ic('trash')} Xoá</button><button class="it" data-v="n">Huỷ</button>`,v=>{if(v==='y')delTask(t,1);});}
  /* (v6) dòng bị xoá THU GỌN lại rồi mới mất, các dòng dưới trượt lên */
  const go2=()=>{const i=DB.tasks.indexOf(t);if(i<0)return;DB.tasks.splice(i,1);if(S.sel===t.id)S.sel=null;rerender();toast('Đã xoá "'+t.title+'"',()=>{DB.tasks.splice(i,0,t);rerender();});};
  collapse(frame.querySelector(`#mbody [data-t="${t.id}"]`),go2);}

document.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(!frame.contains(e.target)||S.loggedOut)return;          /* ngoài app (thanh điều khiển mẫu): chỉ chặn */
  const at={left:e.clientX,top:e.clientY,bottom:e.clientY},T=e.target;
  const r=T.closest('.row[data-t],.kc[data-t],.ev[data-t]');if(r)return ctxMenu(TK(+r.dataset.t),e);   /* 1. việc */
  if(T.closest('.ml-root'))return mlMenu(T,at);                                                          /* 2. myLink */
  const ed=T.closest('input:not([type=file]):not([type=date]),textarea,[contenteditable="true"]');
  if(ed)return textMenu(ed,at);                                                                           /* 3. ô gõ chữ */
  const nv=T.closest('[data-nav]');if(nv&&T.closest('.side,.pbar'))return navMenu(nv.dataset.nav,at);     /* 4. cột trái */
  if(T.closest('.who'))return whoMenu(at);
  const st=T.closest('.step[data-si]');if(st)return stepMenu(+st.dataset.si,at);                         /* 5. bước */
  const tg=T.closest('.tg');if(tg)return tagMenu(tg.textContent.replace(/[#✕]/g,'').trim(),at);          /* 6. thẻ */
  const day=T.closest('.cal .d');if(day)return dayMenu(day.dataset.day,at);                               /* 7. ô lịch */
  const col=T.closest('.col');if(col){const st2=col.querySelector('.kbox').dataset.st;return openPop(at,`<button class="it" data-v="a">${ic('plus')} Thêm việc vào cột "${ST[st2]}"</button>`,()=>openKadd(st2));}
  const g=T.closest('.grp[data-fold]');if(g)return openPop(at,`<button class="it" data-v="f">${g.classList.contains('shut')?'Mở nhóm':'Gập nhóm'}</button><button class="it" data-v="a">Gập / mở tất cả nhóm</button>`,v=>{
    if(v==='f')g.click();else{const all=[...frame.querySelectorAll('.grp[data-fold]')],open=all.some(x=>!x.classList.contains('shut'));all.forEach(x=>{if(open!==x.classList.contains('shut'))x.click();});}});
  if(T.closest('.detail'))return detailMenu(at);                                                          /* 8. khung chi tiết */
  if(T.closest('.head h1'))return appMenu(at,1);
  return appMenu(at);                                                                                     /* 9. chỗ trống */
});

function copyText(s){return (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('Đã sao chép'),()=>{

function textMenu(el,at){
  const hasSel=el.selectionStart!==undefined&&el.selectionStart!==null?el.selectionStart!==el.selectionEnd:String(getSelection()).length>0;
  const note=el.closest('#dNote');
  const B=x=>`<b style="width:18px;text-align:center">${x}</b>`;
  openPop(at,`${hasSel?it('cut','scissors','Cắt','Ctrl X')+it('copy','copy','Sao chép','Ctrl C'):''}${it('paste','paste','Dán','Ctrl V')}${it('all','selall','Chọn tất cả','Ctrl A')}
    ${note?`<div class="hr"></div><div class="lab">Chèn khối</div>${it('b:h','',B('H')+'Tiêu đề')}${it('b:todo','',B('☑')+'Danh sách tích')}${it('b:ul','',B('•')+'Gạch đầu dòng')}${it('b:hr','',B('—')+'Đường kẻ')}`:''}`,async v=>{
    el.focus();
    if(v==='cut'||v==='copy'){document.execCommand(v);toast(v==='cut'?'Đã cắt':'Đã sao chép');}
    else if(v==='paste'){try{document.execCommand('insertText',false,await navigator.clipboard.readText());}catch(_){toast('Trình duyệt chưa cho dán từ menu — dùng Ctrl V');}}
    else if(v==='all'){if(el.select)el.select();else document.execCommand('selectAll');}
    else if(v.startsWith('b:')){const nt=$('dNote'),t=TK(S.sel);const H={h:'<h3>Tiêu đề</h3>',todo:'<div class="todo"><i contenteditable="false"></i> Việc cần tích</div>',ul:'<ul><li>Ý thứ nhất</li></ul>',hr:'<hr>'}[v.slice(2)];
      insertBlock(nt,H);t.note=nt.innerHTML;renderRowOnly(t);}
  });
}

  const row=T.closest('.ml-link-row'),cardHead=T.closest('.ml-card-head'),dayc=T.closest('.ml-day');
  const click=(root,sel)=>{const b=root&&root.querySelector(sel);if(b)b.click();return !!b;};
  if(row){const url=(row.querySelector('.ml-link-input')||{}).value||'',name=(row.querySelector('.ml-name')||{}).textContent||'';
    if(!url)return openPop(at,it('paste','paste','Dán link','Ctrl V')+'<div class="hr"></div>'+it('set','sliders','Cài đặt lớp & lịch'),async v=>{
      if(v==='set')return S.mlH.openSettings();const inp=row.querySelector('input');inp.focus();try{document.execCommand('insertText',false,await navigator.clipboard.readText());}catch(_){toast('Dùng Ctrl V để dán');}});
    return openPop(at,it('open','right','Mở link')+it('cu','copy','Sao chép link')+(name?it('cn','copy','Sao chép tên'):'')+'<div class="hr"></div>'+
      it('tick','check',row.classList.contains('checked')?'Bỏ tích':'Tích đã dùng')+it('up','move','Đưa lên trên')+'<div class="hr"></div>'+it('del','trash','Xoá link','','red'),v=>{
      if(v==='open')click(row,'.ml-open');else if(v==='cu')copyText(url);else if(v==='cn')copyText(name);
      else if(v==='tick')click(row,'.ml-link-tick');else if(v==='up'){if(!click(row,'.ml-up'))toast('Link đã ở trên cùng');}
      else if(v==='del'){click(row,'.ml-kebab');setTimeout(()=>{const d=frame.querySelector('.ml-link-menu-del');if(d)d.click();},30);}});}
  if(cardHead){const card=cardHead.closest('.ml-card');return openPop(at,it('done','check',card.classList.contains('done')?'Bỏ đánh dấu lớp đã xong':'Đánh dấu cả lớp đã xong')+'<div class="hr"></div>'+it('set','sliders','Cài đặt lớp & lịch'),
    v=>{if(v==='done')click(cardHead,'.ml-tick');else S.mlH.openSettings();});}
  if(dayc)return openPop(at,it('go','cal','Xem ngày này')+it('set','sliders','Cài đặt lớp & lịch'),v=>{if(v==='go')dayc.click();else S.mlH.openSettings();});
  openPop(at,it('ref','repeat','Tải lại myLink')+it('set','sliders','Cài đặt lớp & lịch'),v=>{if(v==='ref')S.mlH.refresh();else S.mlH.openSettings();});
}
function go(nav,after){navTo(nav,after);}
function navMenu(k,at){
  if(k==='mylink')return openPop(at,it('o','right','Mở myLink')+it('s','sliders','Cài đặt lớp & lịch'),v=>{go('mylink',v==='s'?()=>setTimeout(()=>S.mlH&&S.mlH.openSettings(),150):null);});
  if(k.startsWith('l:')&&k!=='l:inbox'){const l=L(k.slice(2));
    return openPop(at,it('o','right','Mở')+it('r','pen','Đổi tên')+it('c','tag','Đổi màu')+it('p','print','In danh sách')+'<div class="hr"></div>'+it('d','trash','Xoá danh sách','','red'),v=>{
      go(k,()=>setTimeout(()=>{if(v==='r'){const h=frame.querySelector('[data-ren]');h.focus();document.execCommand('selectAll');}
      else if(v==='c')listMenu(frame.querySelector('.head h1'));else if(v==='p')window.print();
      else if(v==='d')xoaDanhSach(l,frame.querySelector('.head h1'));},v==='o'?0:380));});}
  if(k.startsWith('v:')){const vw=DB.views.find(x=>'v:'+x.id===k);
    return openPop(at,it('o','right','Mở')+it('r','pen','Đổi tên')+'<div class="hr"></div>'+it('d','trash','Xoá chế độ xem','','red'),v=>{
      if(v==='o')return go(k);
      if(v==='d'){DB.views=DB.views.filter(x=>x!==vw);if(S.nav===k)S.nav='all';renderAll();return toast('Đã xoá chế độ xem (việc không bị xoá)');}
      openPop(at,`<div class="lab">Đổi tên</div><input class="pin2" id="pvName" value="${esc(vw.name)}"><button class="it cur" data-v="ok">${ic('check')} Lưu</button>`,()=>{vw.name=$('pvName').value.trim()||vw.name;renderAll();});
      const i2=$('pvName');i2.focus();i2.select();i2.onkeydown=e=>{if(e.key==='Enter'){vw.name=i2.value.trim()||vw.name;closePop();renderAll();}};});}
  const hide={important:'important',planned:'planned','l:inbox':'inbox'}[k];
  openPop(at,it('o','right','Mở')+(k==='myday'?it('a','plus','Thêm việc vào Ngày của tôi'):'')+(hide?'<div class="hr"></div>'+it('h','x','Ẩn khỏi cột trái','bật lại trong Cài đặt'):''),v=>{
    if(v==='h'){S.set.smart[hide]=0;if(S.nav===k)S.nav='myday';renderAll();return toast('Đã ẩn — bật lại trong Cài đặt');}
    go(k,v==='a'?()=>setTimeout(()=>$('qaIn').focus(),380):null);});
}
function whoMenu(at){openPop(at,it('s','sliders','Cài đặt')+it('t',isDark()?'sun':'moon',isDark()?'Chuyển sang Sáng':'Chuyển sang Tối')+'<div class="hr"></div>'+it('o','x','Đăng xuất','','red'),v=>{
  if(v==='s'){S.ovlFrom=at;S.modal='settings';renderOvl();}else if(v==='t'){vt('theme','',()=>{S.set.theme=isDark()?'light':'dark';shell();});}else dangXuat();});}
function stepMenu(i,at){const t=TK(S.sel),s=t.steps[i];
  openPop(at,it('d','check',s.d?'Đánh dấu chưa xong':'Đánh dấu đã xong')+it('n','move','Tách thành việc riêng')+'<div class="hr"></div>'+it('x','trash','Xoá bước','','red'),v=>{
    if(v==='d'){s.d=s.d?0:1;if(s.d)ding();}
    else if(v==='n'){t.steps.splice(i,1);DB.tasks.push({id:nid(),title:s.t,list:t.list,status:'todo',tags:[],steps:[],files:[],note:'',created:TODAY,order:S.set.newTop?-uid:uid});toast('Đã tách thành việc riêng trong '+L(t.list).name);}
    else t.steps.splice(i,1);
    rerender();});}
function tagMenu(tag,at){const t=TK(S.sel);openPop(at,it('f','filter','Xem mọi việc có #'+esc(tag))+it('x','x','Bỏ thẻ này khỏi việc'),v=>{
  if(v==='x'){t.tags=t.tags.filter(x=>x!==tag);return rerender();}
  S.flt.all={tags:[tag]};go('all');});}
function dayMenu(k,at){openPop(at,it('a','plus','Thêm việc vào '+fmtDay(k).toLowerCase()),()=>{openDay(k);openIadd('d:'+k);});}
function detailMenu(at){const t=TK(S.sel);if(!t)return appMenu(at);
  openPop(at,it('m','move','Chuyển sang danh sách…')+it('p','note','Lưu làm mẫu')+it('c','x','Đóng chi tiết','Esc')+'<div class="hr"></div>'+it('d','trash','Xoá việc','Delete','red'),v=>{
    if(v==='m')menuMove(t,at);else if(v==='p'){DB.tpls.push({id:'t'+(nid()),name:t.title,list:t.list,tags:[...t.tags],steps:t.steps.map(s=>s.t),note:t.note});toast('Đã lưu "'+t.title+'" làm mẫu');}
    else if(v==='c'){S.sel=null;renderDetail();renderMain();}else delTask(t);});}
function appMenu(at,head){const sc=scope(S.nav);
  if(sc.mylink)return mlMenu(document.createElement('div'),at);
  openPop(at,it('a','plus','Thêm việc','Ctrl N')+it('n','note','Tạo việc từ mẫu…')+it('k','search','Tìm kiếm','Ctrl K')+'<div class="hr"></div>'+
    it('f','filter','Lọc · Gom nhóm')+it('d','list',S.dense==='full'?'Hiển thị: Gọn':'Hiển thị: Chi tiết')+
    (head&&sc.list&&sc.list!=='inbox'?it('r','pen','Đổi tên danh sách')+it('c','tag','Đổi màu danh sách'):'')+
    '<div class="hr"></div>'+it('t',isDark()?'sun':'moon',isDark()?'Chuyển sang Sáng':'Chuyển sang Tối')+it('s','sliders','Cài đặt'),v=>{
    if(v==='a')$('qaIn').focus();else if(v==='n')tplMenu(at);else if(v==='k'){S.ovlFrom=at;S.cmdk=true;renderOvl();}
    else if(v==='f'){S.fOpen=true;renderMain();}else if(v==='d'){S.dense=S.dense==='full'?'compact':'full';renderMain();}
    else if(v==='r'){const h=frame.querySelector('[data-ren]');h.focus();document.execCommand('selectAll');}else if(v==='c')listMenu(frame.querySelector('.head h1'));
    else if(v==='t'){vt('theme','',()=>{S.set.theme=isDark()?'light':'dark';shell();});}else{S.ovlFrom=at;S.modal='settings';renderOvl();}});}
frame.addEventListener('input',e=>{const h=e.target.closest('[data-ren]');if(h){L(h.dataset.ren).name=h.textContent.trim()||'Không tên';renderSide();}});
frame.addEventListener('keydown',e=>{const h=e.target.closest('[data-ren]');if(h&&e.key==='Enter'){e.preventDefault();h.blur();renderMain();}});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!S.loggedOut){e.preventDefault();if(S.cmdk)return;const si=frame.querySelector('.side [data-a="cmdk"]');S.ovlFrom=si&&si.offsetParent?rectOf(si):null;S.cmdk=true;renderOvl();return;}
  if(S.loggedOut){if(e.key==='Enter'){if($('lMa'))loginMa();else if(e.target.id==='lId')$('lPw').focus();else if($('lPw'))loginGo();}return;}
  if(e.key==='Escape'&&(S.cmdk||S.modal)){closeOvl();return;}
  if(e.target.closest('input,[contenteditable]'))return;
  if(e.key==='Delete'&&S.sel!=null)delTask(TK(S.sel));
  if(e.key==='Escape'){if($('pop').classList.contains('on'))return closePop();if(S.sel==null&&S.selDay){S.selDay=null;S.qaDate=null;renderQa();}S.sel=null;renderDetail();renderMain();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();$('qaIn').focus();}
});
/* thêm việc ở cột Kanban: gắn trạng thái của cột */
const _add=addQA;addQA=function(txt){_add(txt);if(S.qaStatus){const t=DB.tasks[DB.tasks.length-1];setStatus(t,S.qaStatus);S.qaStatus=null;renderMain();}};

  if(S.nav==='tap'&&S.tapH&&S.dev==='phone'&&S.tapH.vePnav)return S.tapH.vePnav();   /* (v2.5.0) ở Tập luyện: thanh dưới = 4 thẻ tập */

{const _a=renderMain,_b=renderDetail,_c=renderSide;

addEventListener('beforeunload',()=>{try{if(!S.loggedOut)window.KHO.luu();}catch(e){}});
/* qua nửa đêm: tải lại để "Hôm nay / Ngày của tôi" sang ngày mới (phiên đăng nhập vẫn giữ trong cửa sổ) */
setInterval(()=>{if(ymd(new Date())!==TODAY&&!frame.querySelector(':focus'))location.reload();},60000);
/* phép thử tự động (Claude): đăng nhập bằng vé TÀI KHOẢN THỬ ZTEST — không dùng mật khẩu thật */
/* (v2.5.1) iPhone bo qua user-scalable=no o Safari => chan them cu chi chum 2 ngon (gesture*) va vuot 2 ngon */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
// (v2.6.0) mở app khi MẤT MẠNG: service worker (chỉ bản web https / localhost — Electron mywork:// không dùng)
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127.0.0.1)$/.test(location.hostname)))navigator.serviceWorker.register('sw.js').catch(e=>console.warn('[sw]',e));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
window.__thu=tok=>S.dangVao?Promise.resolve():window.KHO.thuToken(tok).then(batDau);
if(window.mywork){window.mywork.getVersion().then(v=>S.ver=v).catch(()=>{});if(window.mywork.getAutostart)window.mywork.getAutostart().then(v=>S.autoMin=v).catch(()=>{});}
shell();loginFocus();

{const ks=()=>window.KHO.phienCu().then(u=>{if(u&&S.loggedOut&&!S.lg)batDau(u);});
  if(window.KHO)ks();else addEventListener('kho-san',ks,{once:true});}
